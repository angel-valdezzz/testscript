[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "testscript-lang"
version = "0.1.0"
description = "A typed, readable testing language for Web and API workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Angel Gerardo Molina Valdez"}]
dependencies = ["lark>=1.2,<2", "httpx>=0.28,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
playwright = ["playwright>=1.50,<2"]
selenium = ["selenium>=4.28,<5"]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.11,<1", "mkdocs-material>=9.6,<10"]

[project.scripts]
tscr = "testscript.cli:main"

[project.urls]
Repository = "https://github.com/angel-valdezzz/testscript"
Documentation = "https://angel-valdezzz.github.io/testscript/"

[tool.setuptools.package-data]
testscript = ["grammar.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[project.entry-points."pygments.lexers"]
TestScript = "testscript.highlighting:TestScriptLexer"
