name: Release verified version
on:
  workflow_run:
    workflows: [Verify TestScript]
    types: [completed]
permissions:
  contents: read
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build && python -m twine check dist/*
      - name: Publish verified tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          release_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          release_tag="v${release_version}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; immutable release left unchanged."
            exit 0
          fi
          python scripts/release_notes.py > release-notes.md
          gh release create "$release_tag" dist/* --target "$RELEASE_SHA" --title "TestScript $release_version" --prerelease --notes-file release-notes.md
