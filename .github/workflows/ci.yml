name: Verify TestScript
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: tscr check examples/
      - run: tscr run examples/core.tscr
      - run: python scripts/check_docs.py
  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {provider: playwright, browser: chromium}
          - {provider: playwright, browser: firefox}
          - {provider: playwright, browser: webkit}
          - {provider: playwright, browser: chrome}
          - {provider: playwright, browser: edge}
          - {provider: selenium, browser: chrome}
          - {provider: selenium, browser: firefox}
          - {provider: selenium, browser: edge}
    env:
      TSCR_RUN_BROWSER_TESTS: '1'
      TSCR_TEST_PROVIDER: ${{ matrix.provider }}
      TSCR_TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,playwright,selenium]"
      - if: matrix.browser == 'edge'
        run: python -m playwright install msedge --with-deps
      - if: matrix.provider == 'playwright' && matrix.browser != 'edge'
        run: python -m playwright install ${{ matrix.browser }} --with-deps
      - run: python -m pytest tests/test_browser.py -q
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.provider }}-${{ matrix.browser }}
          path: testscript-results/
          if-no-files-found: ignore
  docs-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/build_docs.py
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: testscript-distribution
          path: dist/
