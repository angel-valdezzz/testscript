name: Animated documentation
on:
  pull_request:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/**', 'mkdocs*.yml', '.github/workflows/landing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" playwright==1.58.0
      - run: python scripts/build_docs.py
      - run: python scripts/check_landing.py
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_landing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-screenshots
          path: build/landing-checks/
