name: Publish documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs*.yml', 'scripts/build_docs.py', 'src/testscript/highlighting.py', 'pyproject.toml', '.github/workflows/docs.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_docs.py
      - run: python scripts/build_docs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
